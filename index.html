<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Dark Forest Portfolio | Interactive Developer Journey</title>
  <meta name="description" content="Explore an interactive 2D Dark Forest portfolio game featuring real-world projects, NPC dialogues, and full-stack software achievements." />
  <meta name="theme-color" content="#1a1a2e" />

  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dark Forest Portfolio | Interactive Developer Journey" />
  <meta property="og:description" content="Venture into the Dark Forest to discover projects, code architectures, and developer achievements." />
  <meta property="og:image" content="/assets/images/preview.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c101e;
      background: radial-gradient(circle at center, #1a1a2e 0%, #0a0e1a 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-container canvas {
      display: block;
      margin: auto;
      max-width: 100vw;
      max-height: 100vh;
      box-shadow: 0 0 50px rgba(0, 217, 255, 0.15), 0 0 100px rgba(74, 144, 255, 0.1);
      border-radius: 4px;
    }

    /* Initial Atmospheric Preloader */
    #initial-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #16213e 0%, #0a0e1a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 500ms ease;
    }

    .preloader-glow {
      width: 80px;
      height: 80px;
      border: 3px solid rgba(74, 144, 255, 0.2);
      border-top-color: #00D9FF;
      border-right-color: #4A90FF;
      border-radius: 50%;
      animation: preloader-spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      box-shadow: 0 0 24px rgba(0, 217, 255, 0.4);
    }

    .preloader-title {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-top: 24px;
      background: linear-gradient(135deg, #ffffff 0%, #00D9FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .preloader-subtitle {
      font-size: 13px;
      color: #a0aec0;
      margin-top: 8px;
      letter-spacing: 1px;
    }

    @keyframes preloader-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Initial Preloader -->
    <div id="initial-preloader">
      <div class="preloader-glow"></div>
      <h1 class="preloader-title">Dark Forest</h1>
      <p class="preloader-subtitle">Loading Developer Realm...</p>
    </div>

    <!-- Phaser 3 Mount Node -->
    <div id="game-container"></div>
  </div>

  <script type="module" src="/src/index.js"></script>
</body>
</html>
